feature: Предложения в YAML-спецификации
code: proposal-notation
description: |-
  Позволяет записывать в группе требований запланированное поведение через
  proposal рядом с обязательными и проверяемыми assert.
definitions:
  tool:
    - validate
  module:
    - specs
specs-unit:
  Формат YAML:
    - assert: Элементы assert и proposal могут находиться в одной группе specs-unit в любом порядке
    - assert: Элемент proposal содержит строковое название в поле proposal и может содержать строковое поле description
    - assert: Каждый элемент группы specs-unit содержит ровно одно из полей assert и proposal
    - assert: Элемент с одновременными полями assert и proposal или без обоих полей отклоняется как некорректный YAML спецификации
    - assert: Существующие спецификации только с элементами assert остаются корректными без миграции
  Правила утверждений:
    - assert: Порядок assert и proposal из YAML сохраняется в модели проекта
    - assert: Два элемента одной группы с одинаковым названием считаются дубликатами независимо от их типа
    - assert: Замена поля proposal на assert переводит существующее утверждение из запланированного в обязательное
    - assert: Ссылки на фичи в названии и description элемента proposal валидируются так же, как ссылки элемента assert
    - assert: Неразрешённая ссылка из proposal создаёт существующую диагностику отсутствующей ссылки
