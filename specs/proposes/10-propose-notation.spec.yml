feature: Предложения в YAML-спецификации
code: propose-notation
description: |-
  Позволяет записывать в группе требований запланированное поведение через
  propose рядом с обязательными и проверяемыми assert.
definitions:
  tool:
    - validate
  module:
    - specs
specs-unit:
  Формат YAML:
    - assert: Элементы assert и propose могут находиться в одной группе specs-unit в любом порядке
    - assert: Элемент propose содержит строковое название в поле propose и может содержать строковое поле description
    - assert: Каждый элемент группы specs-unit содержит ровно одно из полей assert и propose
    - assert: Элемент с одновременными полями assert и propose или без обоих полей отклоняется как некорректный YAML спецификации
    - assert: Существующие спецификации только с элементами assert остаются корректными без миграции
  Правила утверждений:
    - assert: Порядок assert и propose из YAML сохраняется в модели проекта
    - assert: Два элемента одной группы с одинаковым названием считаются дубликатами независимо от их типа
    - assert: Замена поля propose на assert переводит существующее утверждение из запланированного в обязательное
    - assert: Ссылки на фичи в названии и description элемента propose валидируются так же, как ссылки элемента assert
    - assert: Неразрешённая ссылка из propose создаёт существующую диагностику отсутствующей ссылки
