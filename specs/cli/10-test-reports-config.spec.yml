feature: Конфигурация отчётов тестов CLI
code: cli-test-reports-config
description: |-
  Описывает настройку отчётов Jest и JUnit в .tms.json, включая планируемую
  поддержку нескольких файлов каждого формата без миграции существующих конфигураций.

definitions:
  tool:
    - cli
  module:
    - tests

specs-unit:
  Текущая нотация:
    - assert: Корневые опциональные поля jest и JUnit задают по одному отчёту соответствующего формата
    - assert: Одиночная настройка отчёта содержит строковый reportPath и массив keys
    - assert: Одиночная настройка JUnit может дополнительно содержать строковое поле property
    - assert: В одной конфигурации могут одновременно присутствовать одиночные настройки jest и JUnit
  Несколько отчётов:
    - assert: Поля jest и JUnit принимают либо существующий одиночный объект настройки отчёта, либо массив из одного или нескольких таких объектов
    - assert: Одиночная нотация jest и JUnit остаётся корректной без миграции в массив
    - assert: Каждый элемент массива jest содержит reportPath и keys, а каждый элемент массива JUnit дополнительно может содержать property
    - assert: В одной .tms.json можно одновременно указывать несколько отчётов Jest и несколько отчётов JUnit
    - assert: CLI собирает и применяет все отчёты, заданные в одиночной настройке или массивах jest и JUnit
    - assert: Отсутствие файла, указанного в reportPath, не блокирует выгрузку проекта и работу serve
    - assert: При отсутствии файла отчёта из reportPath serve возвращает диагностику с severity warning
  Проверки отчётов:
    - assert: Этот тест должен быть пройден
    - assert: Этот тест должен быть провален
    - assert: Этот тест должен быть пропущен
    - assert: Этот тест должен остаться без автоматизации
