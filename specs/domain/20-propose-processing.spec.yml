feature: Обработка propose
code: propose-processing
description: |-
  Сохраняет тип propose при локальной обработке и экспорте Markdown, но исключает
  предложения из автоматизации и показателей покрытия обязательных утверждений.

specs-unit:
  Автоматизация и покрытие:
    - assert: Не выполняется сопоставление propose с отчётами о тестах
    - assert: Элемент propose остаётся неавтоматизированным при наличии теста с совпадающим составным именем
    - assert: Propose не входит в total, automated и uncovered проекта, деревьев и списка фич
  Синхронизация:
    - propose: Группа выгружается на удалённый сервер с assert и propose в исходном порядке
    - propose: Выгружаемый assert использует `type = assert` и вычисленным isAutomated
    - propose: Выгружаемый propose использует `type = propose` без данных автоматизации
    - propose: При выгрузке propose сохраняются его название и необязательное description
  Остальная обработка:
    - assert: Propose участвует в построении графа зависимостей по ссылкам из названия и description
    - assert: Markdown-экспорт включает propose в исходной группе и порядке и явно помечает его как предложение

definitions:
  tool:
    - cli
  module:
    - specs