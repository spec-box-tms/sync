feature: PUT /api/features/:code/yaml
code: serve-feature-update-put
description: |-
  Сохраняет исходный YAML-файл фичи без разбора или преобразования. Клиент
  передаёт YAML в теле с Content-Type application/yaml; charset=utf-8 и
  полученный через $serve-feature-yaml-get ETag в заголовке If-Match.
definitions:
  tool:
    - serve
  module:
    - backend
specs-unit:
  Успешное сохранение:
    - assert: PUT /api/features/:code/yaml принимает YAML в теле с Content-Type application/yaml; charset=utf-8 и актуальный If-Match
    - assert: PUT /api/features/:code/yaml записывает тело YAML без изменения комментариев, неизвестных полей, порядка ключей и форматирования
    - assert: PUT /api/features/:code/yaml с актуальным If-Match полностью пересчитывает проект и возвращает ProjectSnapshot с HTTP 200
    - assert: PUT /api/features/:code/yaml сохраняет ошибки YAML, неразрешённые ссылки и повторные названия assert или proposal и возвращает их в diagnostics нового ProjectSnapshot
    - assert: Два одновременных PUT /api/features/:code/yaml с одним ETag сохраняют ровно одно тело
  Ошибки сохранения:
    - assert: PUT /api/features/:code/yaml возвращает HTTP 409 без тела и не меняет YAML-файл при отсутствующем или несовпавшем If-Match
    - assert: PUT /api/features/:code/yaml возвращает HTTP 404 без записи для отсутствующей фичи
    - assert: PUT /api/features/:code/yaml возвращает HTTP 415 без записи для JSON или неподдерживаемого Content-Type
