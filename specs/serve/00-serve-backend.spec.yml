feature: Локальный backend serve
code: serve-backend
description: |-
  Локальный backend команды spec-box serve обслуживает Angular SPA, внутренний
  **JSON API** и SSE для текущей рабочей копии проекта. Его цель — дать
  пользователю единое локальное место для просмотра, создания и
  структурированного редактирования YAML-спецификаций, диагностики их
  корректности, просмотра покрытия, зависимостей и истории Git без вызовов
  api.host, запуска тестов, изменения конфигурации или доступа извне
  loopback-адресов.

  Внутренний API включает следующие маршруты:

  - GET /api/project — текущий снимок проекта: $serve-project-get.
  - GET /api/features/:code — текущая фича: $serve-feature-get.
  - GET /api/features/:code?revision=:commit — фича из Git-ревизии: $serve-feature-revision-get.
  - POST /api/features — создание фичи: $serve-feature-create-post.
  - PUT /api/features/:code — сохранение фичи: $serve-feature-update-put.
  - GET /api/features/:code/history — Git-история фичи: $serve-feature-history-get.
  - GET /api/events — SSE-уведомления: $serve-events-get.
definitions:
  tool:
    - serve
  module:
    - backend
