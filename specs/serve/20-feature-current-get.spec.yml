feature: GET /api/features/:code
code: serve-feature-get
description: |-
  Возвращает редактируемую модель текущей YAML-фичи по её коду.

  Модель ответа TypeScript:
  ```ts
  interface Feature {
    code: string;
    title: string;
    description?: string;
    attributes: Record<string, string[]>;
    groups: Array<{
      title: string;
      assertions: Array<
        | { type: 'assert'; title: string; description?: string; isAutomated: boolean }
        | { type: 'propose'; title: string; description?: string; isAutomated: false }
      >;
    }>;
    filePath: string;
    optimisticLock: string;
    gitStatus: 'clean' | 'modified' | 'untracked';
  }
  ```
definitions:
  tool:
    - serve
  module:
    - backend
specs-unit:
  Успешный ответ:
    - assert: GET /api/features/:code возвращает текущую фичу с HTTP 200
    - assert: Ответ содержит код, название, необязательное описание, атрибуты, группы утверждений, относительный путь файла, optimisticLock и gitStatus
    - assert: gitStatus текущей фичи равен clean, modified или untracked по состоянию её YAML-файла в Git
    - assert: Каждый assert ответа содержит type равный assert и вычисленный status
    - assert: Каждый propose ответа содержит type равный propose
    - assert: У фичи без атрибутов и групп ответ содержит attributes как {} и groups как []
    - assert: У фичи без YAML-описания поле description отсутствует в ответе
    - assert: optimisticLock текущей фичи равен MD5 исходных байтов её YAML-файла
  Отсутствующая фича:
    - assert: GET /api/features/:code для отсутствующего кода возвращает HTTP 404
