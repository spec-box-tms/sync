<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пример встроенного HTML</title>
    <style>
      body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #0f172a; background: #f1f5f9; }
      main { max-width: 560px; margin: auto; padding: 24px; border: 1px solid #cbd5e1; border-radius: 12px; background: white; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      summary { cursor: pointer; color: #1d4ed8; }
      code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>HTML внутри Markdown</h1>
      <p>Этот самостоятельный документ служит примером загрузки локального HTML в iframe.</p>
      <details>
        <summary>Показать путь к примеру</summary>
        <p><code>specs/serve/frontend/markdown-example.html</code></p>
      </details>
    </main>
  </body>
</html>
