feature: Ссылки и встроенные ресурсы в Markdown
code: serve-markdown-resources
description: |-
  При отображении Markdown из YAML-спецификаций преобразует адреса ссылок
  и изображений для доступа к файлам относительно каталога запуска serve.
  Правила применяются ко всем местам отображения Markdown, включая просмотр
  фичи, её требований и сравнение версий.

  Адреса, начинающиеся с http:// или https:// без учёта регистра, считаются
  внешними. Остальные адреса передаются целиком как значение query-параметра
  path в GET /api/files с URL-кодированием. Путь не дополняется каталогом
  YAML-файла или текущим маршрутом интерфейса.

  Markdown-изображение с расширением .html отображается как iframe.
  Расширение определяется без учёта регистра по исходному локальному пути
  либо по pathname внешнего HTTP(S)-адреса до query и fragment.

  Используемый API: $serve-file-get.

  ## Пример SVG

  Пути примеров указаны относительно корня репозитория, из которого запускается serve.

  [Открыть SVG-схему](specs/serve/frontend/markdown-example.svg)

  ![SVG-схема доступа к файлам](specs/serve/frontend/markdown-example.svg)

  ## Пример HTML

  [Открыть HTML-пример](specs/serve/frontend/markdown-example.html)

  Следующая Markdown-картинка должна отображаться как iframe с HTML-примером.

  ![HTML-пример встроенного документа](specs/serve/frontend/markdown-example.html)
definitions:
  tool:
    - serve
  module:
    - frontend
specs-unit:
  Ссылки:
    - assert: При отображении Markdown-ссылки `[Документ](docs/readme.txt)` её href равен /api/files?path=docs%2Freadme.txt
    - assert: При отображении Markdown-ссылки с HTTP(S)-адресом её href сохраняет исходный адрес
    - assert: При преобразовании локального адреса Markdown-ссылки её видимый текст сохраняется
    - assert: При отображении Markdown-ссылки `[Отчёт](reports/report.html)` она остаётся ссылкой с href /api/files?path=reports%2Freport.html
      description: |
        ![SVG-схема доступа к файлам](specs/serve/frontend/markdown-example.svg)
  Изображения:
    - assert: При отображении Markdown-изображения `![Схема](images/schema.png)` создаётся изображение с src /api/files?path=images%2Fschema.png
    - assert: При отображении Markdown-изображения с HTTP(S)-адресом без расширения .html его src сохраняет исходный адрес
    - assert: При преобразовании локального адреса Markdown-изображения его альтернативный текст сохраняется
  Кодирование адресов:
    - assert: При отображении локальной Markdown-ссылки или изображения путь разрешается относительно каталога запуска serve независимо от расположения YAML-файла и текущего маршрута интерфейса
    - assert: При отображении локальной Markdown-ссылки или изображения пробел в адресе кодируется как %20 в параметре path
    - assert: При отображении локальной Markdown-ссылки или изображения кириллица в адресе кодируется в параметре path как процентные последовательности байтов UTF-8
    - assert: 'При отображении локальной Markdown-ссылки или изображения символ # в адресе кодируется как %23 внутри path и не становится фрагментом URL API'
    - assert: При отображении локальной Markdown-ссылки или изображения символ ? в адресе кодируется как %3F внутри path
    - assert: При отображении локальной Markdown-ссылки или изображения символ & в адресе кодируется как %26 внутри path и не создаёт дополнительный query-параметр
    - assert: При отображении локальной Markdown-ссылки или изображения символ % в адресе кодируется как %25 внутри path и восстанавливается после однократного декодирования сервером
  HTML в iframe:
    - assert: При отображении Markdown-изображения `![Отчёт](reports/report.html)` вместо изображения создаётся iframe с src /api/files?path=reports%2Freport.html
    - assert: При успешной загрузке локального HTML-файла через API его содержимое отображается внутри iframe на странице Markdown
    - assert: При отображении Markdown-изображения с HTTP(S)-адресом на .html создаётся iframe с исходным адресом в src
    - assert: При отображении Markdown-изображения с расширением .HTML создаётся iframe по тем же правилам, что и для .html
