feature: GET /api/project
code: serve-project-get
description: |-
  Возвращает текущий пересчитанный снимок проекта для интерфейса.

  Модель ответа TypeScript:
  ```ts
  type Severity = 'info' | 'warning' | 'error';
  type GitStatus = 'clean' | 'modified' | 'untracked';
  type StatementCounters = { failed: number; skipped: number; notAutomated: number; automated: number; propose: number };
  type ProjectSnapshot = {
    revision: number;
    project?: { title?: string; description?: string; repository?: string };
    attributes: Array<{ code: string; title: string; values: Array<{ code: string; title: string }> }>;
    treeDefinitions: Array<{ code: string; title: string; groupBy: string[] }>;
    features: Array<Feature>;
    diagnostics: Array<{ code: string; severity: Severity; path: string; message: string }>;
    coverage: { total: number; automated: number; uncovered: number; counters: StatementCounters };
    storageAreas: Array<{ pattern: string; rootPath: string; directories: DirectoryNode[] }>;
    trees: FeatureTree[];
    dependencyGraph: { nodes: Array<{ code: string; title?: string; exists: boolean }>; edges: Array<{ from: string; to: string; resolved: boolean }> };
  };
  type DirectoryNode = { name: string; path: string; children: DirectoryNode[] };
  type FeatureTree = { code: string; title: string; groupBy: string[]; totalCount: number; automatedCount: number; counters: StatementCounters; root: FeatureTreeNode };
  type FeatureTreeNode = { attributeCode?: string; valueCode?: string; valueTitle?: string; totalCount: number; automatedCount: number; counters: StatementCounters; features: string[]; children: FeatureTreeNode[] };
  ```

  Модель `Feature` соответствует $serve-feature-get
definitions:
  tool:
    - serve
  module:
    - backend
specs-unit:
  Успешный ответ:
    - assert: GET /api/project возвращает текущий ProjectSnapshot с HTTP 200 и JSON в кодировке UTF-8
      description: |-
        ```ts
         type Severity = 'info' | 'warning' | 'error';
         type GitStatus = 'clean' | 'modified' | 'untracked';
         type StatementCounters = { failed: number; skipped: number; notAutomated: number; automated: number; propose: number };
         type ProjectSnapshot = {
           revision: number;
           project?: { title?: string; description?: string; repository?: string };
           attributes: Array<{ code: string; title: string; values: Array<{ code: string; title: string }> }>;
           treeDefinitions: Array<{ code: string; title: string; groupBy: string[] }>;
           features: Array<Feature & { gitStatus: GitStatus }>;
           diagnostics: Array<{ code: string; severity: Severity; path: string; message: string }>;
           coverage: { total: number; automated: number; uncovered: number; counters: StatementCounters };
           storageAreas: Array<{ pattern: string; rootPath: string; directories: DirectoryNode[] }>;
           trees: FeatureTree[];
           dependencyGraph: { nodes: Array<{ code: string; title?: string; exists: boolean }>; edges: Array<{ from: string; to: string; resolved: boolean }> };
         };
         type DirectoryNode = { name: string; path: string; children: DirectoryNode[] };
         type FeatureTree = { code: string; title: string; groupBy: string[]; totalCount: number; automatedCount: number; counters: StatementCounters; root: FeatureTreeNode };
         type FeatureTreeNode = { attributeCode?: string; valueCode?: string; valueTitle?: string; totalCount: number; automatedCount: number; counters: StatementCounters; features: string[]; children: FeatureTreeNode[] };
         ```
    - assert: Корректный ProjectSnapshot содержит ревизию, сведения о проекте, атрибуты, определения деревьев, фичи, диагностики, покрытие, области хранения, деревья и граф зависимостей
    - assert: Каждая фича ProjectSnapshot сохраняет type каждого assert и propose
    - assert: Каждая фича ProjectSnapshot содержит gitStatus clean, modified или untracked по состоянию её YAML-файла в Git
    - assert: Ревизия ProjectSnapshot увеличивается после каждого полного пересчёта проекта
    - assert: При ошибке YAML, мета-файла или отчёта ProjectSnapshot сохраняет данные остальных корректных файлов и содержит соответствующую диагностику
    - assert: При некорректной новой версии .tms.json работающий сервер возвращает ProjectSnapshot только с ревизией и диагностиками
    - assert: Каждое дерево и его ветви содержат количество всех и автоматизированных assert входящих фич
  Покрытие и зависимости:
    - assert: Покрытие в ProjectSnapshot показывает количество всех, автоматизированных и непокрытых assert по загруженным отчётам Jest и JUnit
    - assert: Поле coverage и каждое дерево с его ветвями содержат counters с числом failed, skipped, notAutomated, automated assert и числом propose
    - assert: Каждый assert увеличивает ровно один из counters failed, skipped, notAutomated или automated в соответствии со своим status, а каждый propose увеличивает только counters propose
    - assert: Для каждого набора counters total или totalCount равен сумме failed, skipped, notAutomated и automated, а propose не входит в total, totalCount, automated, automatedCount или uncovered
    - assert: Плоский JUnit-отчёт Node.js сопоставляет testcase с утверждением по составному имени
    - assert: Признак автоматизации утверждения означает его сопоставление с тестом в текущем отчёте и не зависит от успешности запуска теста
    - assert: Граф зависимостей содержит вершины существующих фич и рёбра для ссылок между фичами
    - assert: Граф зависимостей ProjectSnapshot содержит связи из названия и description propose
    - assert: Неразрешённая ссылка добавляется в граф как несуществующая вершина и неразрешённое ребро вместе с диагностикой
