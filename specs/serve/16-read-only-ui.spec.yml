feature: Интерфейс только для чтения
code: serve-read-only-ui
description: |-
  Ограничивает доступные в Angular-интерфейсе действия в соответствии с
  полем ProjectSnapshot.readOnly в ответе GET /api/project, сохраняя просмотр
  фичи доступным.
definitions:
  tool:
    - serve
  module:
    - frontend
specs-unit:
  Состояние доступности:
    - assert: До ответа GET /api/project и при HTTP-ошибке интерфейс остаётся только для чтения
    - assert: После успешного ответа GET /api/project интерфейс использует поле ProjectSnapshot.readOnly
  Ограничение редактирования:
    - assert: В режиме только для чтения YAML фичи остаётся видимым, а ссылка Редактировать, кнопка Сохранить и редактор отсутствуют даже при mode=edit
    - assert: При ProjectSnapshot.readOnly false в режиме просмотра доступна ссылка Редактировать, а в mode=edit доступны редактор и кнопка Сохранить
