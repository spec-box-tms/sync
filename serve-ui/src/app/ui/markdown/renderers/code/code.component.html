@if (token().lang === 'mermaid') {
  <md-mermaid [code]="token().text"></md-mermaid>
} @else {
  <pre>
    <code [highlight]="token().text" [language]="token().lang ?? 'text'" lineNumbers>
    </code>
    <button
      class="copy"
      appearance="secondary"
      iconStart="@tui.clipboard"
      size="s"
      [tuiButtonCopy]="token().text"
      type="button"
    >
      Скопировать
    </button>
  </pre>
}
