<label>
  YAML
  <textarea [disabled]="saving()" [value]="yaml()" (input)="yaml.set($any($event.target).value)"></textarea>
</label>
<button type="button" [disabled]="saving()" (click)="load()">Перезагрузить</button>
<button type="button" [disabled]="!ready() || saving()" (click)="save()">Сохранить</button>
@if (message()) {
  <p>{{ message() }}</p>
}
