<div class="meta">
  @for (attribute of attributes(); track attribute.code) {
    <attribute [attributeCode]="attribute.code" [attributeValues]="attribute.values" />
  }
</div>
@if (feature().description; as _description) {
  <markdown [value]="_description" />
}

@for (group of feature().groups; track group.title) {
  <feature-group [group]="group" />
}
