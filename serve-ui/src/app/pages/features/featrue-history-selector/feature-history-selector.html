<tui-textfield
  class="history-selector"
  iconStart="@tui.git-compare-arrows"
  tuiChevron
  tuiTextfieldSize="s"
  [tuiTextfieldCleaner]="true"
>
  <input placeholder="Текущая версия" tuiSelect [(ngModel)]="value" />

  <tui-data-list-wrapper *tuiDropdown [items]="featureHistory()" [itemContent]="content" />
</tui-textfield>

<ng-template #content let-history>
  <div class="history-item">
    <div>
      {{ history.message }}
    </div>
    <div class="caption">
      <span>
        {{ history.author }}
      </span>
      <span>
        {{ history.date | date: 'dd.MM.yyyy HH:mm' }}
      </span>
    </div>
  </div>
</ng-template>
