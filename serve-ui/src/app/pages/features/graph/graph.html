<div #graph aria-label="Граф зависимостей фич" class="graph" role="img"></div>

<div class="controls-container">
  <label>
    Вид графа
    <select [value]="layout()" (change)="onLayoutChange($event)">
      <option value="breadthfirst">Зависимости</option>
      <option value="circle">Круг</option>
      <option value="concentric">Концентрический</option>
      <option value="weighted">Весовой</option>
    </select>
  </label>
  <label>
    Поколений
    <input
      [disabled]="!featureCode()"
      [value]="generations()"
      (input)="onGenerationsChange($event)"
      min="0"
      step="1"
      type="number"
    />
  </label>
</div>
