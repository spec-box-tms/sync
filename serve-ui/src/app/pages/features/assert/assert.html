<div class="status">
  <div class="copy-path">
    <button
      iconStart="@tui.link"
      size="xs"
      tuiIconButton
      appearance="flat"
      [style.border-radius.%]="100"
      (click)="copyPath()"
    ></button>
  </div>

  @if (assertion().type === 'propose') {
    <div tuiBadge appearance="neutral" size="m" tuiHint="Предложение">
      <tui-icon  icon="@tui.circle-dashed" size="m" />
    </div>
  } @else if (status() === 'failed') {
    <div tuiBadge appearance="negative" tuiStatus size="m" tuiHint="Проверка не пройдена"></div>
  } @else if (status() === 'automated') {
    <div
      tuiBadge
      appearance="positive"
      tuiStatus
      size="m"
      tuiHint="Проверка автоматизирована"
    ></div>
  } @else if (status() === 'skipped') {
    <div
      tuiBadge
      appearance="warning"
      tuiStatus
      size="m"
      tuiHint="Проверка пропущена"
    ></div>
  } @else {
    <div
      tuiBadge
      appearance="neutral"
      tuiStatus
      size="m"
      tuiHint="Нет автоматической проверки"
    ></div>
  }
  <markdown [value]="title()" />
</div>
@if (description(); as _description) {
  <div class="expander" (click)="toggleExpanded()">
    @if (expanded()) {
      <tui-icon [style.font-size.px]="16" icon="@tui.chevron-down" />
    } @else {
      <tui-icon [style.font-size.px]="16" icon="@tui.chevron-right" />
    }
    Описание
  </div>
  <div class="description">
    <tui-expand [expanded]="expanded()">
      <markdown *tuiItem [value]="_description" />
    </tui-expand>
  </div>
}
